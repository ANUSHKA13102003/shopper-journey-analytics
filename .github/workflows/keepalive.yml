name: Keep Render App Warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit health endpoint on Render
        run: |
          curl -fsS --max-time 60 --retry 2 https://shopper-journey-analytics.onrender.com/_stcore/health
          echo ""
